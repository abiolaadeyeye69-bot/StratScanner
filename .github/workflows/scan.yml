name: Daily STRAT Scan

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC, Mon-Fri — after US market close
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two result-publishing runs push at the same time.
concurrency:
  group: results-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore Polygon data cache
        uses: actions/cache@v4
        with:
          path: cache/daily
          key: polygon-cache-${{ github.run_id }}
          restore-keys: |
            polygon-cache-
      - name: Run scanner
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
        run: python scanner.py --verbose
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: output/
          retention-days: 30
      - name: Publish latest result for the dashboard
        if: always()
        run: |
          LATEST=$(ls -t output/*.json 2>/dev/null | head -n1)
          if [ -z "$LATEST" ]; then
            echo "No output JSON found, skipping publish step."
            exit 0
          fi
          mkdir -p results
          cp "$LATEST" results/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/latest.json
          if git diff --cached --quiet; then
            echo "No change in results, nothing to commit."
          else
            git commit -m "Update latest scan results [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
                exit 0
              fi
              echo "push attempt ${attempt} failed, retrying..."
              sleep 5
            done
            echo "Could not push results after 3 attempts" >&2
            exit 1
          fi

# Wake scheduler — ensure cron fires on schedule
